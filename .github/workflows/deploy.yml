
name: Deploy SprintLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sprintlab-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/sprintlab_actions
          chmod 600 ~/.ssh/sprintlab_actions
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Transfer application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh -i ~/.ssh/sprintlab_actions -o IdentitiesOnly=yes" \
            ./ "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/"

           - name: Install dependencies and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/sprintlab_actions \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            "export NVM_DIR=\"\$HOME/.nvm\" &&
             source \"\$NVM_DIR/nvm.sh\" &&
             cd '$DEPLOY_PATH/server' &&
             npm ci &&
             cd '$DEPLOY_PATH/client' &&
             npm ci &&
             npm run build &&
             pm2 restart sprintlab-api --update-env"
